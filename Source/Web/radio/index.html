<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rádio • Zpěvník</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#edf2ff;font:16px system-ui;padding:28px}main{max-width:850px;margin:auto}h1{margin:0}p{color:#bbc6dc;line-height:1.5}.card{background:#1e293b;border:1px solid #3a4860;border-radius:18px;padding:22px;margin:20px 0}button,select,input{font:inherit;border-radius:9px;padding:12px;border:1px solid #516078;background:#101827;color:inherit}button{cursor:pointer;background:#305ed5}button:disabled{opacity:.5}select{width:100%;margin-bottom:15px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#title{font-size:25px;font-weight:700;margin:18px 0;min-height:35px}#history{padding-left:20px}li{margin:12px 0;color:#cbd5e1}input[type=range]{padding:0}#error{color:#ffb5a9}details input{width:100%;margin:6px 0}small{color:#bac7dc}
</style></head><body><main><div class="row"><h1>Rádio</h1><button id="background">Zpět do Zpěvníku</button></div><p>Zavření tohoto okna skryje ovládání. Rádio hraje dál, dokud ho nezastavíš nebo neukončíš Zpěvník.</p><div class="card"><label for="stations">Stanice</label><select id="stations"></select><div class="row"><button id="play">▶ Přehrát</button><button id="stop">■ Zastavit</button><label for="volume">Hlasitost</label><input id="volume" type="range" min="0" max="1" step="0.01" value="0.7"></div><div id="title">Vyber stanici a spusť přehrávání.</div><p id="audioStatus" role="status">Zastaveno</p><small id="metadata"></small><p id="error" role="alert"></p><audio id="audio" preload="none"></audio></div><details class="card"><summary>Přidat vlastní stanici</summary><label>Název<input id="name" maxlength="150"></label><label>Adresa streamu<input id="url" type="url" placeholder="https://…/stream.mp3"></label><button id="add">Přidat stanici</button></details><div class="card"><h2>Naposledy hrálo</h2><p>Historie ICY údajů z aktuálního spuštění Zpěvníku.</p><ol id="history"></ol></div><small>Přehrávač vychází z tvého iRMP. Bez loga aplikace.</small></main><script src="radio.js"></script></body></html>
